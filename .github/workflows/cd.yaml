name: CD

on:
  push:
    tags: ['v*']

# O workflow compartilhado publica no GHCR (packages: write); um workflow
# reutilizável não pode exceder as permissões concedidas pelo chamador.
permissions:
  contents: read
  packages: write

jobs:
  cd:
    uses: InventraTech/.github/.github/workflows/cd-python.yaml@main
    with:
      image-name: inventra-ai
      gitops-app: inventra-ai
    secrets: inherit
